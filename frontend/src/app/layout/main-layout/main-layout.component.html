<mat-sidenav-container class="app-shell">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <mat-icon>task_alt</mat-icon>
      <span>Task Manager</span>
    </div>

    <mat-nav-list>
      <!-- Todos los roles autenticados ven este ítem -->
      <a mat-list-item routerLink="/tasks" routerLinkActive="active-link">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>Mis tareas</span>
      </a>

      <!-- Menú personalizado: solo el rol ADMIN ve la opción de crear -->
      @if (authService.isAdmin()) {
        <a mat-list-item routerLink="/tasks/new" routerLinkActive="active-link">
          <mat-icon matListItemIcon>add_circle_outline</mat-icon>
          <span matListItemTitle>Nueva tarea</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <span class="spacer"></span>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <mat-icon>account_circle</mat-icon>
        {{ authService.currentUser()?.name }}
        <span class="role-badge">{{ authService.currentUser()?.role }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
